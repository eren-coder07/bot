<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payload Tunnel — Admin</title>
<style>
  :root { --bg:#0f1216; --card:#171c21; --card2:#1e242b; --border:#2a3420; --lime:#d4f53c;
          --text:#f2f5ec; --dim:#9aa38e; --red:#ff6b5e; --green:#8fd14f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  a { color:var(--lime); }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border);
           position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .grow { flex:1; }
  .stat { font-size:12px; color:var(--dim); }
  .stat b { color:var(--lime); }
  button { background:var(--lime); color:#141a08; border:0; border-radius:10px; padding:9px 14px; font-weight:600;
           cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button.red { background:var(--red); color:#1a0806; }
  button.small { padding:5px 9px; font-size:12px; border-radius:8px; }
  input, textarea, select { width:100%; background:#0d1014; color:var(--text); border:1px solid var(--border);
           border-radius:9px; padding:9px 10px; font-size:14px; font-family:inherit; }
  textarea { min-height:90px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  label { font-size:12px; color:var(--dim); display:block; margin:10px 0 4px; }
  .tabs { display:flex; gap:6px; padding:12px 18px 0; flex-wrap:wrap; }
  .tabs button { background:var(--card); color:var(--dim); border:1px solid var(--border); }
  .tabs button.on { background:var(--lime); color:#141a08; border-color:var(--lime); }
  main { padding:16px 18px 60px; max-width:1000px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1; min-width:120px; }
  .row.tight > * { flex:0 0 auto; min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; }
  .pill { font-size:11px; padding:2px 8px; border-radius:20px; display:inline-block; }
  .pill.on { background:rgba(143,209,79,.15); color:var(--green); }
  .pill.off { background:rgba(255,107,94,.15); color:var(--red); }
  .mono { font-family:ui-monospace,Menlo,monospace; }
  .muted { color:var(--dim); font-size:12px; }
  dialog { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:16px;
           width:min(560px,92vw); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .hide { display:none !important; }
  .keybox { background:#0d1014; border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:8px;
            font-family:ui-monospace,Menlo,monospace; font-size:13px; white-space:pre-wrap; word-break:break-all; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:560px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="card" style="max-width:360px;margin:12vh auto;">
  <h1 style="margin:0 0 4px">Payload Tunnel</h1>
  <div class="muted">Admin panel</div>
  <label>Password</label>
  <input id="pw" type="password" onkeydown="if(event.key==='Enter')login()" autofocus>
  <div id="loginErr" class="muted" style="color:var(--red);margin-top:8px"></div>
  <button style="margin-top:12px;width:100%" onclick="login()">Sign in</button>
</div>

<!-- App -->
<div id="app" class="hide">
  <header>
    <h1>Payload Tunnel</h1>
    <span class="stat" id="stats"></span>
    <span class="grow"></span>
    <button class="ghost small" onclick="load()">Refresh</button>
    <button class="ghost small" onclick="logout()">Logout</button>
  </header>
  <div class="tabs">
    <button class="on" data-tab="servers" onclick="tab('servers')">Configs</button>
    <button data-tab="keys" onclick="tab('keys')">Access keys</button>
    <button data-tab="settings" onclick="tab('settings')">Settings</button>
  </div>
  <main>
    <section id="tab-servers">
      <div class="card">
        <div class="row tight">
          <button onclick="editConfig(null)">+ New config</button>
          <button class="ghost" onclick="importDlg.showModal()">Import JSON / NapsternetV</button>
        </div>
      </div>
      <div class="card"><table id="configTable"></table></div>
    </section>

    <section id="tab-keys" class="hide">
      <div class="card">
        <div class="grid2">
          <div><label>How many</label><input id="kCount" type="number" value="1" min="1" max="500"></div>
          <div><label>Minutes each</label><input id="kMin" type="number" value="60"></div>
        </div>
        <label>Label (optional)</label><input id="kLabel" placeholder="e.g. batch Nov, customer name">
        <button style="margin-top:12px" onclick="genKeys()">Generate keys</button>
        <div id="newKeys" class="keybox hide"></div>
      </div>
      <div class="card"><table id="keyTable"></table></div>
    </section>

    <section id="tab-settings" class="hide">
      <div class="card" id="settingsCard"></div>
    </section>
  </main>
</div>

<!-- Config editor -->
<dialog id="configDlg">
  <h3 id="cfgTitle" style="margin-top:0">Config</h3>
  <input id="cfgId" type="hidden">
  <div class="grid2">
    <div><label>Name</label><input id="cfgName"></div>
    <div><label>Group (optional)</label><input id="cfgGroup" placeholder="Free Vip"></div>
  </div>
  <label>Mode</label>
  <select id="cfgMode" onchange="cfgModeChange()">
    <option value="SSH_PROXY_PAYLOAD">SSH-Proxy-Payload</option>
    <option value="SSH_PAYLOAD">SSH-Payload</option>
    <option value="SSH_DIRECT">SSH Direct</option>
    <option value="SSH_PROXY">SSH-Proxy (HTTP CONNECT)</option>
    <option value="SSH_TLS">SSH-TLS (SSL/SNI)</option>
    <option value="SSH_TLS_PAYLOAD">SSH-TLS-Payload</option>
    <option value="VLESS_WS_TLS">VLESS-WS-TLS</option>
  </select>
  <div class="grid2">
    <div><label id="lblHost">Host</label><input id="cfgHost"></div>
    <div><label>Port</label><input id="cfgPort" type="number" value="443"></div>
  </div>
  <div class="grid2 cfgSsh">
    <div><label>Username</label><input id="cfgUser"></div>
    <div><label>Password</label><input id="cfgPass"></div>
  </div>
  <div class="cfgProxy"><label>Remote proxy host:port (optional)</label><input id="cfgProxy" placeholder="investor.snap.com:80"></div>
  <div class="cfgTls"><label>TLS SNI (server name)</label><input id="cfgSni" placeholder="google.com"></div>
  <div class="cfgVless grid2">
    <div><label>UUID</label><input id="cfgUuid"></div>
    <div><label>WebSocket path</label><input id="cfgWsPath" value="/"></div>
  </div>
  <div class="cfgVless"><label>WebSocket Host header (optional)</label><input id="cfgWsHost"></div>
  <div class="cfgPayload"><label>Payload (use [crlf], [lf], [host], [ua]…)</label><textarea id="cfgPayload"></textarea></div>
  <div class="row" style="margin-top:12px">
    <label style="margin:0;display:flex;align-items:center;gap:6px;color:var(--text)"><input type="checkbox" id="cfgEnabled" checked style="width:auto"> Enabled (visible in app)</label>
  </div>
  <div class="row tight" style="margin-top:14px;justify-content:flex-end">
    <button class="ghost" onclick="configDlg.close()">Cancel</button>
    <button onclick="saveConfig()">Save</button>
  </div>
</dialog>

<dialog id="importDlg">
  <h3 style="margin-top:0">Import configs</h3>
  <div class="muted">Paste this app's export, a NapsternetV-style dump, or a flat dump.</div>
  <textarea id="importText" style="min-height:180px;margin-top:8px"></textarea>
  <div class="row tight" style="margin-top:12px;justify-content:flex-end">
    <button class="ghost" onclick="importDlg.close()">Cancel</button>
    <button onclick="doImport()">Import</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
let state = {configs:[], keys:[], settings:{}, stats:{}};

async function api(path, method='GET', body) {
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'},
    body: body?JSON.stringify(body):undefined});
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  if (!r.ok) { let m=''; try{m=(await r.json()).detail||'';}catch{} throw new Error(m||('HTTP '+r.status)); }
  return r.json();
}
function showLogin(){ $('#app').classList.add('hide'); $('#login').classList.remove('hide'); }
async function login(){
  try { await api('/admin/login','POST',{password:$('#pw').value}); $('#login').classList.add('hide');
        $('#app').classList.remove('hide'); load(); }
  catch(e){ $('#loginErr').textContent = 'Wrong password'; }
}
async function logout(){ await api('/admin/logout','POST'); showLogin(); }

function tab(name){
  for (const s of document.querySelectorAll('main section')) s.classList.add('hide');
  $('#tab-'+name).classList.remove('hide');
  for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.tab===name);
}

async function load(){
  state = await api('/admin/api/state');
  const s = state.stats;
  $('#stats').innerHTML = `<b>${s.activeNow}</b> active · <b>${s.onlineToday}</b> today · ${s.keys} keys (${s.banned} banned) · ${s.configs} configs`;
  renderConfigs(); renderKeys(); renderSettings();
}

function fmtMode(m){ return ({SSH_PROXY_PAYLOAD:'SSH·proxy',SSH_PAYLOAD:'SSH·payload',SSH_DIRECT:'SSH',
  SSH_PROXY:'SSH·CONNECT',SSH_TLS:'SSH·SSL',SSH_TLS_PAYLOAD:'SSH·SSL+payload',VLESS_WS_TLS:'VLESS·WS/TLS'})[m]||m; }

function renderConfigs(){
  const t = $('#configTable');
  t.innerHTML = '<tr><th>Name</th><th>Group</th><th>Type</th><th>Host</th><th></th><th></th></tr>' +
    state.configs.map(c => `<tr>
      <td><b>${esc(c.name)}</b></td><td class="muted">${esc(c.group||'—')}</td>
      <td><span class="pill on">${fmtMode(c.mode)}</span></td>
      <td class="mono muted">${esc(c.sshHost)}:${c.sshPort}</td>
      <td>${c.enabled?'<span class="pill on">on</span>':'<span class="pill off">off</span>'}</td>
      <td class="row tight" style="justify-content:flex-end">
        <button class="ghost small" onclick="editConfig('${c.id}')">Edit</button>
        <button class="red small" onclick="delConfig('${c.id}','${esc(c.name)}')">Del</button></td></tr>`).join('');
}

function cfgModeChange(){
  const m = $('#cfgMode').value;
  const vless = m==='VLESS_WS_TLS';
  const tls = m==='SSH_TLS'||m==='SSH_TLS_PAYLOAD'||vless;
  const payload = m==='SSH_PAYLOAD'||m==='SSH_PROXY_PAYLOAD'||m==='SSH_PROXY'||m==='SSH_TLS_PAYLOAD';
  const proxy = m==='SSH_PROXY_PAYLOAD'||m==='SSH_PROXY';
  for (const el of document.querySelectorAll('.cfgSsh')) el.classList.toggle('hide', vless);
  for (const el of document.querySelectorAll('.cfgVless')) el.classList.toggle('hide', !vless);
  for (const el of document.querySelectorAll('.cfgTls')) el.classList.toggle('hide', !tls);
  for (const el of document.querySelectorAll('.cfgPayload')) el.classList.toggle('hide', !payload);
  for (const el of document.querySelectorAll('.cfgProxy')) el.classList.toggle('hide', !proxy);
  $('#lblHost').textContent = vless ? 'Server address' : 'SSH host';
}

function editConfig(id){
  const c = state.configs.find(x=>x.id===id) || {mode:'SSH_PROXY_PAYLOAD',wsPath:'/',enabled:true,sshPort:443};
  $('#cfgTitle').textContent = id?'Edit config':'New config';
  $('#cfgId').value=c.id||''; $('#cfgName').value=c.name||''; $('#cfgGroup').value=c.group||'';
  $('#cfgMode').value=c.mode||'SSH_PROXY_PAYLOAD'; $('#cfgHost').value=c.sshHost||''; $('#cfgPort').value=c.sshPort||443;
  $('#cfgUser').value=c.username||''; $('#cfgPass').value=c.password||''; $('#cfgProxy').value=c.proxy||'';
  $('#cfgSni').value=c.sni||''; $('#cfgUuid').value=c.vlessUuid||''; $('#cfgWsPath').value=c.wsPath||'/';
  $('#cfgWsHost').value=c.wsHost||''; $('#cfgPayload').value=c.payload||''; $('#cfgEnabled').checked=c.enabled!==false;
  cfgModeChange(); configDlg.showModal();
}
async function saveConfig(){
  const body = { id:$('#cfgId').value||undefined, name:$('#cfgName').value.trim(), group:$('#cfgGroup').value.trim(),
    mode:$('#cfgMode').value, sshHost:$('#cfgHost').value.trim(), sshPort:parseInt($('#cfgPort').value)||443,
    username:$('#cfgUser').value, password:$('#cfgPass').value, proxy:$('#cfgProxy').value.trim(),
    sni:$('#cfgSni').value.trim(), vlessUuid:$('#cfgUuid').value.trim(), wsPath:$('#cfgWsPath').value.trim()||'/',
    wsHost:$('#cfgWsHost').value.trim(), payload:$('#cfgPayload').value, enabled:$('#cfgEnabled').checked };
  if(!body.name||!body.sshHost){ alert('Name and host are required'); return; }
  try{ await api('/admin/api/configs','POST',body); configDlg.close(); load(); }catch(e){ alert(e.message); }
}
async function delConfig(id,name){ if(!confirm('Delete "'+name+'"?'))return; await api('/admin/api/configs/'+id,'DELETE'); load(); }
async function doImport(){
  try{ const r=await api('/admin/api/configs/import','POST',{text:$('#importText').value});
       importDlg.close(); $('#importText').value=''; alert('Imported '+r.imported+' config(s)'); load(); }
  catch(e){ alert(e.message); }
}

function fmtTime(sec){ sec=Math.max(0,sec|0); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return h?`${h}h ${m}m`:`${m}m`; }
function renderKeys(){
  const t=$('#keyTable');
  t.innerHTML='<tr><th>Key</th><th>Label</th><th>Time left</th><th>Ads</th><th>Status</th><th></th></tr>'+
    state.keys.map(k=>`<tr>
      <td class="mono">${esc(k.key)}</td><td class="muted">${esc(k.label||'—')}</td>
      <td>${fmtTime(k.remaining)}</td><td class="muted">${k.adCount}</td>
      <td>${k.banned?'<span class="pill off">banned</span>':'<span class="pill on">active</span>'}</td>
      <td class="row tight" style="justify-content:flex-end">
        <button class="ghost small" onclick="addTime('${k.key}')">+time</button>
        <button class="ghost small" onclick="toggleBan('${k.key}',${k.banned?0:1})">${k.banned?'Unban':'Ban'}</button>
        <button class="red small" onclick="delKey('${k.key}')">Del</button></td></tr>`).join('');
}
async function genKeys(){
  try{ const r=await api('/admin/api/keys','POST',{count:parseInt($('#kCount').value)||1,
        minutes:parseInt($('#kMin').value)||60, label:$('#kLabel').value});
    const box=$('#newKeys'); box.classList.remove('hide'); box.textContent=r.keys.join('\n'); load(); }
  catch(e){ alert(e.message); }
}
async function addTime(key){ const m=prompt('Add how many minutes? (negative to remove)','60'); if(m===null)return;
  await api('/admin/api/keys/'+key,'POST',{addMinutes:parseInt(m)||0}); load(); }
async function toggleBan(key,banned){ await api('/admin/api/keys/'+key,'POST',{banned:!!banned}); load(); }
async function delKey(key){ if(!confirm('Delete key '+key+'?'))return; await api('/admin/api/keys/'+key,'DELETE'); load(); }

const SETTINGS_FIELDS = [
  ['freeSessionMinutes','Free minutes per new key'],
  ['adRewardMinutes','Minutes added per watched ad'],
  ['maxBankedMinutes','Max minutes a key can bank'],
  ['adMinIntervalSeconds','Min seconds between ads'],
  ['adMaxPerHour','Max ads per hour'],
  ['startAppId','Start.io app id'],
  ['minClientVersion','Minimum app version (force update)'],
  ['bindDeviceToKey','Lock each key to one device (1/0)'],
  ['announcement','Announcement shown in app'],
];
function renderSettings(){
  $('#settingsCard').innerHTML = SETTINGS_FIELDS.map(([k,label])=>
    `<label>${label}</label>${k==='announcement'
      ? `<textarea id="set_${k}" style="min-height:60px">${esc(state.settings[k]||'')}</textarea>`
      : `<input id="set_${k}" value="${esc(state.settings[k]||'')}">`}`).join('') +
    `<button style="margin-top:14px" onclick="saveSettings()">Save settings</button>`;
}
async function saveSettings(){
  const body={}; for(const [k] of SETTINGS_FIELDS) body[k]=$('#set_'+k).value;
  await api('/admin/api/settings','POST',body); alert('Saved'); load();
}

function esc(s){ return (s==null?'':''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// start
(async ()=>{ try{ await load(); $('#login').classList.add('hide'); $('#app').classList.remove('hide'); }
  catch(e){ showLogin(); } })();
</script>
</body>
</html>
