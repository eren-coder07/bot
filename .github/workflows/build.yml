name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Server/secrets baked into the APK (set these in repo Settings -> Secrets).
      # APP_SECRET MUST equal the control server's APP_SECRET or config decryption fails.
      SERVER_URL: ${{ secrets.SERVER_URL }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      CERT_PIN_SHA256: ${{ secrets.CERT_PIN_SHA256 }}
      START_APP_ID: ${{ secrets.START_APP_ID || '210964446' }}
    steps:
      - name: Checkout (with tun2socks submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore generated once by this workflow and reused from the Actions cache,
      # so updates install over the previous version. Ignored when secrets are set.
      - name: Restore generated keystore
        uses: actions/cache@v4
        with:
          path: ~/.payloadtunnel-keystore
          key: payloadtunnel-release-keystore-v1

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            dir="$HOME/.payloadtunnel-keystore"
            mkdir -p "$dir"
            if [ ! -f "$dir/release.jks" ]; then
              echo "No release keystore configured: generating one"
              keytool -genkeypair -noprompt -keystore "$dir/release.jks" \
                -storepass payloadtunnel -keypass payloadtunnel -alias payloadtunnel \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Payload Tunnel, OU=CI, O=PayloadTunnel, C=US"
            else
              echo "Reusing keystore generated by an earlier run"
            fi
            {
              echo "RELEASE_STORE_FILE=$dir/release.jks"
              echo "RELEASE_STORE_PASSWORD=payloadtunnel"
              echo "RELEASE_KEY_ALIAS=payloadtunnel"
              echo "RELEASE_KEY_PASSWORD=payloadtunnel"
            } >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify R8 kept the load-bearing names (JSch reflection, JNI class)
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          jsch=$(unzip -p "$apk" 'classes*.dex' | strings | grep -c jcraft || true)
          tproxy=$(unzip -p "$apk" 'classes*.dex' | strings | grep -c TProxyNative || true)
          echo "jcraft refs: $jsch, TProxyNative refs: $tproxy"
          [ "$jsch" -gt 0 ] && [ "$tproxy" -gt 0 ]

      - name: Verify signature and rename
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | head -n 3
          mkdir -p dist
          cp "$apk" "dist/PayloadTunnel-v${VERSION_NAME}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayloadTunnel-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Payload Tunnel v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Built from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            Download **PayloadTunnel-v${{ env.VERSION_NAME }}.apk** below and open it on your phone to install
            (allow "Install unknown apps" for your browser or file manager when asked).
